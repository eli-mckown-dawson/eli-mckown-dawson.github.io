# Research papers, newest first.

- title: The Costs of Voting and Voter Confidence
  url: https://doi.org/10.1177/10659129241283169
  venue: Political Research Quarterly
  date: "2024-09"
  coauthors: Lonna Rae Atkeson and Robert Stein
  summary: >-
    Measured the association between party identification and confidence in
    accurate ballot counting in the 2012, 2016 and 2020 U.S. elections.

- title: The Impact of Voter Confusion in Ranked Choice Voting
  url: https://ideas.repec.org/a/bla/socsci/v105y2024i4p1029-1041.html
  venue: Social Science Quarterly
  date: "2024-07"
  coauthors: Lonna Rae Atkeson, Kyle Saunders and Jack Santucci
  summary: >-
    Analyzed exit poll data from the first ranked choice voting election in
    Santa Fe, New Mexico.

- title: Device Effects in Online Public Opinion Surveys
  url: https://www.dropbox.com/scl/fi/0yuacvlc9lhitog7ib7ey/Thesis-20.pdf?rlkey=fx52mqhhdcp4cak7tnxqkad2d&e=1&st=k8x503xh&dl=0
  venue: Senior thesis, Florida State University
  date: "2024-05"
  summary: >-
    Tested whether taking online public opinion surveys on a mobile device
    reduces response quality compared with a laptop or desktop computer.

- title: Voter Perceptions of Secrecy in the 2020 Election
  url: https://doi.org/10.1089/elj.2022.0064
