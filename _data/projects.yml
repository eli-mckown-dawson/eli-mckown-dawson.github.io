- title: What if past polling errors repeated?
  url: https://www.natesilver.net/p/the-polls-are-close-but-that-doesnt
  kind: Analysis
  when: Nov 2024
  image: polling-errors.webp
  width: 1000
  height: 1308
  alt: "Chart showing how the 2024 battleground polling averages would shift if the polling errors of 2012, 2016 and 2020 repeated."
