- title: Presidential approval average
  url: https://www.natesilver.net/p/trump-approval-ratings-nate-silver-bulletin
  kind: Silver Bulletin
  when: Updated several times a day
  image: approval-average.webp
  width: 1000
  height: 897
  alt: "Silver Bulletin chart of Trump's approval (45.0%) and disapproval (51.2%) as of May 15, 2025, with shaded uncertainty bands since January."
  summary: >-
    An average of every public poll of Trump's approval, weighted for each
    poll's quality, recency, sample size and partisan lean. It also tracks
    approval on issues like immigration and the economy, and splits strong
    from weak approval.
  role:
    - Designed and maintain the polling database
    - Built the dashboard charts
    - Update the average several times a day
  links:
    - label: See the tracker
      url: https://www.natesilver.net/p/trump-approval-ratings-nate-silver-bulletin
    - label: Strong vs. weak approval
      url: https://www.natesilver.net/p/were-tracking-more-data-on-trumps

- title: 2024 presidential election forecast
  url: https://www.natesilver.net/p/nate-silver-2024-president-election-polls-model
