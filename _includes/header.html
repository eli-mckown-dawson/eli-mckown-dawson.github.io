<header class="col mast">
  <a class="name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <nav aria-label="Main">
    {%- for item in site.nav %}
    {%- assign active = false %}
    {%- if page.url == item.url %}{% assign active = true %}{% endif %}
    <a href="{{ item.url | relative_url }}"{% if active %} aria-current="page"{% endif %}>{{ item.title }}</a>
    {%- endfor %}
  </nav>
</header>
